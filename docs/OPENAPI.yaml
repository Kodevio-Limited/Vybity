                  maxLength: 500
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/media:
    get:
      tags:
      - Admin
      summary: Media moderation queue
      parameters:
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/media/{id}/decision:
    post:
      tags:
      - Admin
      summary: Approve/reject media
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/places:
    get:
      tags:
      - Admin
      summary: Place inventory
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags:
      - Admin
      summary: Create a place
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - lat
              - lng
              properties:
                name:
                  type: string
                address_line1:
                  type: string
                city:
                  type: string
                lat:
                  type: number
                lng:
                  type: number
                timezone:
                  type: string
                environment:
                  $ref: '#/components/schemas/Environment'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /admin-api/places/{id}:
    patch:
      tags:
      - Admin
      summary: Edit/hide a place
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                status:
                  type: string
                  enum:
                  - active
                  - hidden
                city:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/places/import:
    post:
      tags:
      - Admin
      summary: Bulk import + geo-dedupe places
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                ref:
                  type: string
      responses:
        '202':
          $ref: '#/components/responses/Success'
  /admin-api/gamification/badges:
    get:
      tags:
      - Admin
      summary: Badge catalogue
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/gamification/badges/{id}:
    put:
      tags:
      - Admin
      summary: Create/update a badge
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                icon_url:
                  type: string
                criteria:
                  type: object
                active:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/settings/xp-rules:
    patch:
      tags:
      - Admin
      summary: Tune XP rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - action
              - xp
              properties:
                action:
                  type: string
                xp:
                  type: integer
                daily_cap:
                  type: integer
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /admin-api/audit-logs:
    get:
      tags:
      - Admin
      summary: Query the audit trail
      parameters:
      - name: actor
        in: query
        schema:
          type: string
      - name: entity
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          $ref: '#/components/responses/Success'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    placeId:
      name: place_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    sessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    claimId:
      name: claim_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    token:
      name: token
      in: path
      required: true
      schema:
        type: string
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    Success:
      description: Success envelope
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {}
              meta:
                $ref: '#/components/schemas/Meta'
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Meta:
      type: object
      properties:
        next_cursor:
          type: string
          nullable: true
        unread_count:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
            request_id:
              type: string
    Device:
      type: object
      required:
      - platform
      - push_token
      properties:
        platform:
          type: string
          enum:
          - ios
          - android
        push_token:
          type: string
    Author:
      type: object
      properties:
        handle:
          type: string
        avatar:
          type: object
          properties:
            id:
              type: string
            url:
              type: string
    RightNow:
      type: object
      properties:
        crowd:
          type: string
          nullable: true
        noise:
          type: string
          nullable: true
        wait_minutes:
          type: integer
          nullable: true
        parking:
          type: string
          nullable: true
        status:
          type: string
          enum:
          - available
          - limited_current_information
        updated_at:
          type: string
          format: date-time
    Reliability:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/ReliabilityLevel'
        community_updates_count:
          type: integer
        live_biz_updates_count:
          type: integer
        most_recent_update_at:
          type: string
          format: date-time
          nullable: true
        explanation:
          type: string
    PlaceCard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        distance_m:
          type: integer
        is_open:
          type: boolean
        reliability:
          type: object
          properties:
            level:
              $ref: '#/components/schemas/ReliabilityLevel'
        updated_at:
          type: string
          format: date-time
        right_now:
          allOf:
          - $ref: '#/components/schemas/RightNow'
          nullable: true
        tags:
          type: array
          items:
            type: string
        live_biz_update:
          type: object
          nullable: true
          properties:
            text:
              type: string
            posted_at:
              type: string
              format: date-time
        event:
          type: object
          nullable: true
          properties:
            title:
              type: string
            starts_at:
              type: string
              format: date-time
        offer:
          type: object
          nullable: true
          properties:
            title:
              type: string
            description:
              type: string
        why_this_fits:
          type: string
          nullable: true
        is_saved:
          type: boolean
        location:
          type: object
          properties:
            location_id:
              type: string
              format: uuid
            name:
              type: string
            lat:
              type: number
            lng:
              type: number
    CommunityUpdateRequest:
      type: object
      required:
      - visit_id
      properties:
        visit_id:
          type: string
          format: uuid
        crowd:
          $ref: '#/components/schemas/CrowdLevel'
        noise:
          $ref: '#/components/schemas/NoiseLevel'
        wait:
          $ref: '#/components/schemas/WaitBucket'
        parking:
          $ref: '#/components/schemas/ParkingLevel'
        atmosphere:
          type: array
          items:
            $ref: '#/components/schemas/Atmosphere'
          minItems: 1
          maxItems: 3
        note:
          type: string
          maxLength: 500
        media_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 4
    ReliabilityLevel:
      type: string
      enum:
      - high
      - medium
      - low
      - insufficient_data
    CrowdLevel:
      type: string
      enum:
      - light
      - moderate
      - busy
      - packed
    NoiseLevel:
      type: string
      enum:
      - quiet
      - moderate
      - loud
    WaitBucket:
      type: string
      enum:
      - none
      - 5_min
      - 10_min
      - 20_plus_min
    ParkingLevel:
      type: string
      enum:
      - easy
      - moderate
      - difficult
      - full
      - not_applicable
    Atmosphere:
      type: string
      enum:
      - cozy
      - lively
      - romantic
      - casual
      - trendy
      - loud_music
    Environment:
      type: string
      enum:
      - outdoors
      - indoors
    NotRightNowReason:
      type: string
      enum:
      - too_crowded
      - too_loud
      - too_expensive
      - too_far
      - not_the_right_atmosphere
      - changed_my_mind
      - other
    TravelMode:
      type: string
      enum:
      - walking
      - driving
      - transit
    AccountType:
      type: string
      enum:
      - consumer
      - provider
    OtpPurpose:
      type: string
      enum:
      - email_verification
      - password_reset
    ClaimStatus:
      type: string
      enum:
      - none
      - draft
      - pending_review
      - approved
      - rejected
    PermissionModule:
      type: string
      enum:
      - overview
      - live_updates
      - promotions_calendar
      - offers_coupons
      - analytics
      - location_profile
      - reports
    PublishMode:
      type: string
      enum:
      - now
      - schedule
    LiveUpdateStatus:
      type: string
      enum:
      - scheduled
      - published
      - expired
      - ended
    OfferStatus:
      type: string
      enum:
      - scheduled
      - active
      - expired
      - ended
    CalendarItemType:
      type: string
      enum:
      - update
      - special
      - event
      - coupon
      - reminder
    ReportStatus:
      type: string
      enum:
      - pending_review
      - upheld
      - dismissed
    DisputeStatus:
      type: string
      enum:
      - open
      - in_progress
      - resolved
