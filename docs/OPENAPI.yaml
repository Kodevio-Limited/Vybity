openapi: 3.0.3
info:
  title: Vybity API
  version: 3.0.0
  description: 'Canonical contract for the Vybity consumer app, business portal, and admin panel. Django REST + PostgreSQL/PostGIS. The backend is the source of truth for permissions, visits, reliability, XP, and publication state. Envelope: { data, meta? }; errors: { error: { code, message, fields?, request_id } }. Paths marked (assumption) or PROPOSED-NO-FIGMA are pending owner confirmation.

    '
servers:
- url: https://api.vybity.com/api/v1
  description: Production (placeholder)
  variables: {}
tags:
- name: Auth
- name: Identity
- name: Content
- name: Location
- name: Home
- name: Chat
- name: Places
- name: Visits
- name: Contribute
- name: Media
- name: Saved
- name: Profile
- name: Business Auth
- name: Business Claim
- name: Business Dashboard
- name: Business Settings
- name: Admin
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register (email)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              - password_confirmation
              - accepted_terms
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                accepted_terms:
                  type: boolean
                device:
                  $ref: '#/components/schemas/Device'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                device:
                  $ref: '#/components/schemas/Device'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '423':
          $ref: '#/components/responses/Error'
  /auth/social/{provider}:
    post:
      tags:
      - Auth
      summary: Social sign-in (google|apple)
      security: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum:
          - google
          - apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_token
              properties:
                id_token:
                  type: string
                authorization_code:
                  type: string
                full_name:
                  type: string
                device:
                  $ref: '#/components/schemas/Device'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
  /auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Start password recovery
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /auth/otp/verify:
    post:
      tags:
      - Auth
      summary: Verify OTP (email or reset)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - otp
              - purpose
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                purpose:
                  $ref: '#/components/schemas/OtpPurpose'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/otp/resend:
    post:
      tags:
      - Auth
      summary: Resend OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - purpose
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  $ref: '#/components/schemas/OtpPurpose'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '429':
          $ref: '#/components/responses/Error'
  /auth/reset-password:
    post:
      tags:
      - Auth
      summary: Set a new password with a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reset_token
              - password
              - password_confirmation
              properties:
                reset_token:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '410':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Log out
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                all_devices:
                  type: boolean
                  default: false
      responses:
        '204':
          description: No content
  /me/identity:
    get:
      tags:
      - Identity
      summary: Public identity (handle + avatar)
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /me/account-type:
    put:
      tags:
      - Identity
      summary: Set consumer|provider intent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - account_type
              properties:
                account_type:
                  $ref: '#/components/schemas/AccountType'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /locations/search:
    get:
      tags:
      - Location
      summary: Geocode an address
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 120
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /me/location:
    get:
      tags:
      - Location
      summary: Current location
      responses:
        '200':
          $ref: '#/components/responses/Success'
    put:
      tags:
      - Location
      summary: Set current location (gps or manual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - source
              properties:
                source:
                  type: string
                  enum:
                  - gps
                  - manual
                lat:
                  type: number
                lng:
                  type: number
                location_id:
                  type: string
                  format: uuid
                location:
                  type: string
                  description: coordinate string / DMS / geohash / Plus Code (D27)
                q:
                  type: string
                  description: free-text place to geocode (D27)
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /home:
    get:
      tags:
      - Home
      summary: Home payload
      parameters:
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /chat/sessions:
    post:
      tags:
      - Chat
      summary: Start a discovery conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              properties:
                text:
                  type: string
                  maxLength: 500
                suggestion_id:
                  type: string
                  format: uuid
                location:
                  type: object
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /chat/sessions/{session_id}/messages:
    get:
      tags:
      - Chat
      summary: Conversation history
      parameters:
      - $ref: '#/components/parameters/sessionId'
      - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags:
      - Chat
      summary: Send a turn (text or quick reply)
      parameters:
      - $ref: '#/components/parameters/sessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  maxLength: 500
                quick_reply_id:
                  type: string
                  format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /places/{place_id}:
    get:
      tags:
      - Places
      summary: Place details
      parameters:
      - $ref: '#/components/parameters/placeId'
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '404':
          $ref: '#/components/responses/Error'
  /places/{place_id}/community-updates:
    get:
      tags:
      - Places
      summary: Community updates (paged)
      parameters:
      - $ref: '#/components/parameters/placeId'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    post:
      tags:
      - Contribute
      summary: Submit a presence-gated community update
      parameters:
      - $ref: '#/components/parameters/placeId'
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommunityUpdateRequest'
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /places/compare:
    get:
      tags:
      - Places
      summary: Compare 2–3 places
      parameters:
      - name: ids
        in: query
        required: true
        schema:
          type: string
          description: csv of 2-3 uuids
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /places/{place_id}/directions:
    get:
      tags:
      - Places
      summary: Directions, ETA, arrive-at
      parameters:
      - $ref: '#/components/parameters/placeId'
      - name: origin_lat
        in: query
        required: true
        schema:
          type: number
      - name: origin_lng
        in: query
        required: true
        schema:
          type: number
      - name: mode
        in: query
        schema:
          $ref: '#/components/schemas/TravelMode'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /places/{place_id}/follow:
    put:
      tags:
      - Places
      summary: Follow a place
      parameters:
      - $ref: '#/components/parameters/placeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - notifications
              properties:
                notifications:
                  type: boolean
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
      - Places
      summary: Unfollow a place
      parameters:
      - $ref: '#/components/parameters/placeId'
      responses:
        '204':
          description: No content
  /places/{place_id}/reports:
    post:
      tags:
      - Places
      summary: 'PROPOSED-NO-FIGMA: report content'
      parameters:
      - $ref: '#/components/parameters/placeId'
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - affected_content_type
              - affected_content_id
              - reason
              properties:
                affected_content_type:
                  type: string
                  enum:
                  - live_update
                  - offer
                  - gallery_media
                  - contribution
                affected_content_id:
                  type: string
                  format: uuid
                reason:
                  type: string
                note:
                  type: string
                  maxLength: 500
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /offers/{offer_id}/redeem:
    post:
      tags:
      - Places
      summary: 'PROPOSED-NO-FIGMA: redeem a coupon'
      parameters:
      - name: offer_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /contribute/places:
    get:
      tags:
      - Contribute
      summary: Places needing a fresh update
      parameters:
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /media/uploads:
    post:
      tags:
      - Media
      summary: Start a presigned media upload
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - kind
              - content_type
              - size_bytes
              properties:
                kind:
                  type: string
                  enum:
                  - photo
                  - video
                content_type:
                  type: string
                size_bytes:
                  type: integer
                  minimum: 1
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /media/{media_id}/complete:
    post:
      tags:
      - Media
      summary: Confirm upload and start processing
      parameters:
      - name: media_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '422':
          $ref: '#/components/responses/Error'
  /visits:
    post:
      tags:
      - Visits
      summary: Report arrival (auto or manual)
      parameters:
      - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - place_id
              - method
              - location
              properties:
                place_id:
                  type: string
                  format: uuid
                method:
                  type: string
                  enum:
                  - auto
                  - manual
                location:
                  type: object
                  required:
                  - lat
                  - lng
                  properties:
                    lat:
                      type: number
                    lng:
                      type: number
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /visits/active:
    get:
      tags:
      - Visits
      summary: Active visit + contribution due state
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /me/saved-places:
    get:
      tags:
      - Saved
      summary: Saved places (paged)
      parameters:
      - name: lat
        in: query
        schema:
          type: number
      - name: lng
        in: query
        schema:
          type: number
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /me/saved-places/{place_id}:
    put:
      tags:
      - Saved
      summary: Save a place
      parameters:
      - $ref: '#/components/parameters/placeId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
    delete:
      tags:
      - Saved
      summary: Unsave a place
      parameters:
      - $ref: '#/components/parameters/placeId'
      responses:
        '204':
          description: No content
  /me:
    get:
      tags:
      - Profile
      summary: Personal information
      responses:
        '200':
          $ref: '#/components/responses/Success'
    patch:
      tags:
      - Profile
      summary: Change email (OTP gated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '202':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
  /me/email/verify:
    post:
      tags:
      - Profile
      summary: Verify the new email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - otp
              properties:
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
  /me/password:
    post:
      tags:
      - Profile
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              - new_password_confirmation
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
                new_password_confirmation:
                  type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
  /me/devices:
    post:
      tags:
      - Profile
      summary: Register a push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Device'
      responses:
        '201':
          $ref: '#/components/responses/Success'
  /me/account-deletion:
    post:
      tags:
      - Profile
      summary: Schedule account deletion (30d)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - password
              properties:
                password:
                  type: string
                reason:
                  type: string
                  maxLength: 500
      responses:
        '202':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Profile
      summary: Cancel scheduled deletion
      responses:
        '204':
          description: No content
  /business/auth/register:
    post:
      tags:
      - Business Auth
      summary: Portal self sign-up
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
                business_name:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/Success'
        '409':
          $ref: '#/components/responses/Error'
  /business/auth/login:
    post:
      tags:
      - Business Auth
      summary: Provider sign-in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /business/auth/refresh:
    post:
      tags:
      - Business Auth
      summary: Rotate provider tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Error'
  /business/auth/logout:
    post:
      tags:
      - Business Auth
      summary: Log out
      responses:
        '204':
          description: No content
  /business/auth/forgot-password:
    post:
      tags:
      - Business Auth
      summary: Recovery start
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /business/auth/otp/verify:
    post:
      tags:
      - Business Auth
      summary: Verify OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - otp
              - purpose
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: ^[0-9]{6}$
                purpose:
                  $ref: '#/components/schemas/OtpPurpose'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/Error'
  /business/auth/otp/resend:
    post:
      tags:
      - Business Auth
      summary: Resend OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - purpose
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  $ref: '#/components/schemas/OtpPurpose'
      responses:
        '200':
          $ref: '#/components/responses/Success'
  /business/auth/reset-password:
    post:
      tags:
      - Business Auth
      summary: Set a new password
      security: []
      requestBody:
